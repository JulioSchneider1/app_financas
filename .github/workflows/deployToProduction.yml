name: Deploy Production

on:
  workflow_dispatch:

jobs:
  deploy-production:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Production
        uses: appleboy/ssh-action@master

        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: ${{ secrets.VM_PORT }}

          script: |
            echo "1. Atualizando pacotes na VM Hospedeira..."
            sudo apt-get update -y

            echo "2. Verificando/Instalando Docker na VM..."
            if ! command -v docker &> /dev/null; then
              sudo apt-get install docker.io -y
              sudo systemctl enable docker && sudo systemctl start docker
            fi

            echo "3. Criando rede Docker para Produção (se não existir)..."
            sudo docker network create production_network || true

            echo "4. Verificando se o PostgreSQL de Produção já existe..."
            if ! sudo docker ps -a --format '{{.Names}}' | grep -q '^postgres_production$'; then
              echo "   -> Banco não encontrado, criando novo container PostgreSQL..."
              sudo docker run -d \
                --name postgres_production \
                --network production_network \
                -e POSTGRES_DB=financeiro \
                -e POSTGRES_USER=postgres \
                -e POSTGRES_PASSWORD=postgres \
                -p 5432:5432 \
                -v postgres_production_data:/var/lib/postgresql/data \
                postgres:16
            else
              echo "   -> Banco já existe, mantendo dados e garantindo que está rodando..."
              sudo docker start postgres_production || true
            fi

            echo "5. Removendo container antigo da aplicação (apenas a app, não o banco)..."
            sudo docker rm -f app_financas_production || true

            echo "6. Criando novo container da aplicação de Produção..."
            sudo docker run -d -t \
              --name app_financas_production \
              --network production_network \
              -p 5000:5000 \
              ubuntu:22.04

            echo "7. Instalando dependências básicas (git, python3, pip, venv, postgresql-client)..."
            sudo docker exec app_financas_production apt-get update -y
            sudo docker exec app_financas_production apt-get install -y git python3 python3-pip python3-venv postgresql-client

            echo "8. Clonando o repositório da aplicação dentro do Container..."
            sudo docker exec app_financas_production mkdir -p /opt/projeto_production
            sudo docker exec app_financas_production git clone -b production https://github.com/JulioSchneider1/app_financas /opt/projeto_production

            echo "9. Criando o arquivo .env dentro do Container..."
            sudo docker exec -i app_financas_production sh -c "cat > /opt/projeto_production/.env" <<EOF
            EMAIL_USER=${{ secrets.EMAIL_USER }}
            EMAIL_PASSWORD=${{ secrets.EMAIL_PASSWORD }}
            DB_USER=${{ secrets.DB_USER }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            DB_HOST=postgres_production
            DB_PORT=5432
            DB_NAME=${{ secrets.DB_NAME }}
            SECRET_KEY=${{ secrets.SECRET_KEY }}
            EOF

            echo "10. Instalando dependências Python do projeto..."
            sudo docker exec app_financas_production pip3 install -r /opt/projeto_production/requirements.txt

            echo "11. Garantindo permissão de execução no entrypoint..."
            sudo docker exec app_financas_production chmod +x /opt/projeto_production/docker-entrypoint.sh

            echo "12. Iniciando a aplicação..."
            sudo docker exec -d -w /opt/projeto_production app_financas_production sh -c "cd /opt/projeto_production && nohup ./docker-entrypoint.sh > flask.log 2>&1 &"

            echo "Deploy de Produção finalizado com sucesso!"