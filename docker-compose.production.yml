services:
  postgres:
    image: postgres:16

    container_name: postgres_production

    environment:
      POSTGRES_DB: financeiro
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_production_data:/var/lib/postgresql/data

  flask_app:
    build: .

    container_name: app_financas_production

    depends_on:
      - postgres

    env_file:
      - .env

    environment:
      DB_HOST: postgres
      DB_NAME: financeiro
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_PORT: 5432

    ports:
      - "5000:5000"

    restart: always

volumes:
  postgres_production_data: